<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Diwali 🪔</title>

<!-- WhatsApp link preview (naam page par friend khud type karega, isliye yahan generic rakha hai) -->
<meta property="og:type" content="website">
<meta property="og:title" content="Happy Diwali! 🪔 Tere liye ek surprise hai">
<meta property="og:description" content="Apna naam aur birthday daalo, phir diya jalao ✨">
<meta name="description" content="Apna naam aur birthday daalo, phir diya jalao.">
<meta name="theme-color" content="#0b1020">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,500&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
  :root {
    --night: #0b1020;
    --gold: #f5c04a;
    --gold-soft: #ffe9a8;
    --orange: #ff8a1f;
    --maroon: #5a0f1f;
    --clay: #b5532c;
    --serif: "Playfair Display", Georgia, "Times New Roman", serif;
    --sans: "Poppins", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { min-height: 100%; }
  body {
    background: radial-gradient(ellipse at 50% 100%, #1b1033 0%, var(--night) 55%, #05070f 100%);
    color: var(--gold-soft);
    font-family: var(--sans);
    overflow-x: hidden;
  }

  /* ---------- background layers ---------- */
  .stars { position: fixed; inset: 0; z-index: 0; transition: opacity 2.5s; pointer-events: none; }
  .stars i {
    position: absolute; width: 2px; height: 2px; border-radius: 50%;
    background: #fff; opacity: .15;
    animation: twinkle var(--d, 3s) ease-in-out var(--delay, 0s) infinite alternate;
  }
  @keyframes twinkle { to { opacity: .85; transform: scale(1.6); } }
  body.lit .stars { opacity: .25; }

  /* warm glow that spreads out from the diya */
  #glow {
    position: fixed; inset: 0; z-index: 1; pointer-events: none;
    opacity: 0; transform: scale(.3); transform-origin: 50% 62%;
    background: radial-gradient(circle at 50% 62%,
      rgba(255,184,64,.62) 0, rgba(255,120,30,.42) 28%,
      rgba(120,20,36,.52) 62%, rgba(11,16,32,.2) 100%);
    transition: opacity 2.6s ease, transform 2.8s ease;
  }
  body.lit #glow { opacity: 1; transform: scale(1.35); }

  #fx { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; }

  /* ---------- layout ---------- */
  .stage {
    position: relative; z-index: 3;
    min-height: 100vh; min-height: 100svh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 24px 20px 28px; text-align: center;
  }

  /* message block: collapsed until the diya is lit */
  .msg {
    max-height: 0; opacity: 0; overflow: hidden;
    padding: 0 6px; width: min(100%, 520px);
    transition: max-height 1.2s ease, opacity 1s ease, margin 1s ease;
  }
  body.talk .msg { max-height: 1200px; opacity: 1; margin-bottom: 18px; }

  .reveal { opacity: 0; transform: translateY(10px); transition: opacity 1.1s ease, transform 1.1s ease; }
  .reveal.show { opacity: 1; transform: none; }

  .greeting {
    font-family: var(--serif); font-weight: 600;
    font-size: clamp(1.9rem, 9vw, 3.3rem); line-height: 1.15;
    padding: 6px 4px 14px;
    background: linear-gradient(180deg, #fff3c4 0%, var(--gold) 55%, #e8892b 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 14px rgba(255,170,50,.55));
  }
  .line {
    font-weight: 300; font-size: clamp(.95rem, 4vw, 1.12rem); line-height: 1.75;
    margin-top: 16px; white-space: pre-line;      /* \n se line break */
    color: #fff1d2; text-shadow: 0 2px 12px rgba(60,10,10,.85);
  }
  .line.closing {
    font-family: var(--serif); font-weight: 600; font-size: clamp(1.1rem, 4.8vw, 1.4rem);
    margin-top: 26px; color: var(--gold);
    text-shadow: 0 0 16px rgba(255,170,50,.45), 0 2px 10px rgba(60,10,10,.85);
  }
  .joke {
    font-family: var(--serif); font-style: italic; font-weight: 500;
    font-size: clamp(.9rem, 3.7vw, 1.05rem); line-height: 1.6;
    margin-top: 18px; color: var(--gold-soft); opacity: 0;
    text-shadow: 0 2px 10px rgba(60,10,10,.85);
  }
  .joke.show { opacity: .92; }
  .sign strong { font-weight: 600; letter-spacing: .06em; }
  .sign {
    margin-top: 18px; font-weight: 400; font-size: clamp(1rem, 4vw, 1.15rem);
    color: var(--gold); text-shadow: 0 2px 10px rgba(60,10,10,.85);
  }

  /* ---------- diya ---------- */
  .diya-btn {
    background: none; border: 0; cursor: pointer; color: inherit;
    padding: 18px 22px;               /* big, forgiving tap area */
    border-radius: 24px; outline: none;
  }
  .diya-btn:focus-visible { box-shadow: 0 0 0 3px rgba(245,192,74,.7); }
  .diya-btn[disabled] { cursor: default; }
  .diya { display: block; width: min(64vw, 260px); height: auto; overflow: visible; transition: width 1.2s ease; }
  body.talk .diya { width: min(40vw, 170px); }

  #flame {
    transform-box: fill-box; transform-origin: 50% 100%;
    transform: scale(0); opacity: 0;
    filter: drop-shadow(0 0 12px rgba(255,160,40,.95));
  }
  body.lit #flame { animation: grow 1.2s cubic-bezier(.2,.8,.2,1) forwards; }
  @keyframes grow { to { opacity: 1; transform: scale(1); } }

  .outer, .inner { transform-box: fill-box; transform-origin: 50% 100%; }
  body.lit .outer { animation: flick 1.7s ease-in-out 1.2s infinite alternate; }
  body.lit .inner { animation: flick2 1.1s ease-in-out 1.2s infinite alternate; }
  @keyframes flick {
    0%   { transform: scale(1,1) skewX(0deg);       filter: brightness(1); }
    20%  { transform: scale(.96,1.06) skewX(2deg);  filter: brightness(1.15); }
    45%  { transform: scale(1.04,.93) skewX(-3deg); filter: brightness(.95); }
    70%  { transform: scale(.97,1.08) skewX(2.5deg);filter: brightness(1.2); }
    100% { transform: scale(1.02,.97) skewX(-1deg); filter: brightness(1.05); }
  }
  @keyframes flick2 {
    0%   { transform: scale(1,1) skewX(0deg); }
    35%  { transform: scale(.92,1.1) skewX(-2deg); }
    65%  { transform: scale(1.05,.92) skewX(3deg); }
    100% { transform: scale(.97,1.04) skewX(-1deg); }
  }

  .hint {
    margin-top: 6px; font-weight: 300; font-size: clamp(.95rem, 4vw, 1.1rem);
    color: var(--gold-soft); letter-spacing: .02em;
    animation: pulse 2.4s ease-in-out infinite; transition: opacity .8s;
  }
  @keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
  body.lit .hint { opacity: 0; animation: none; height: 0; margin: 0; overflow: hidden; }

  .replay {
    margin-top: 8px; padding: 10px 22px; border-radius: 999px; cursor: pointer;
    font-family: var(--sans); font-size: .95rem; color: var(--gold-soft);
    background: rgba(90,15,31,.55); border: 1px solid rgba(245,192,74,.5);
    pointer-events: none;
  }
  .replay.show { pointer-events: auto; }
  .replay:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }

  /* ---------- intro form (name + birthday) ---------- */
  .intro { width: min(100%, 360px); }
  .intro h1 {
    font-family: var(--serif); font-weight: 600; line-height: 1.2;
    font-size: clamp(1.7rem, 7.5vw, 2.4rem); margin-bottom: 10px;
    background: linear-gradient(180deg, #fff3c4 0%, var(--gold) 60%, #e8892b 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .intro p.sub { font-weight: 300; font-size: 1rem; line-height: 1.6; margin-bottom: 22px; color: var(--gold-soft); opacity: .85; }
  .intro label { display: block; text-align: left; font-size: .9rem; margin: 14px 4px 6px; color: var(--gold-soft); opacity: .9; }
  .intro input {
    width: 100%; padding: 14px 16px; border-radius: 14px; color-scheme: dark;
    font-family: var(--sans); font-size: 16px;      /* 16px stops iOS zoom */
    color: #fff1d2; background: rgba(255,255,255,.06); border: 1px solid rgba(245,192,74,.45);
  }
  .intro input:focus { outline: 2px solid var(--gold); outline-offset: 2px; }
  .intro .err { min-height: 1.4em; margin-top: 12px; font-size: .9rem; color: #ffb199; }
  .intro .go {
    width: 100%; margin-top: 6px; padding: 14px; border: 0; border-radius: 14px; cursor: pointer;
    font-family: var(--sans); font-size: 1rem; font-weight: 400; color: #3a0c16;
    background: linear-gradient(180deg, #ffd96b, #f0a02a);
  }
  .intro .go:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }

  .scene { display: none; width: 100%; flex-direction: column; align-items: center; }
  body.started .scene { display: flex; animation: sceneIn 1s ease both; }
  body.started .intro { display: none; }
  @keyframes sceneIn { from { opacity: 0; } to { opacity: 1; } }

  /* fun age message, printed character by character */
  .agemsg {
    font-weight: 400; font-size: clamp(1rem, 4.4vw, 1.2rem); line-height: 1.7;
    color: #fff1d2; text-shadow: 0 2px 12px rgba(60,10,10,.85); padding-bottom: 16px;
  }
  .ch { opacity: 0; transition: opacity .25s ease; }
  .ch.on { opacity: 1; }

  @keyframes shake {
    0%, 100% { transform: translate(0, 0); }
    20% { transform: translate(-5px, 3px); } 40% { transform: translate(5px, -3px); }
    60% { transform: translate(-3px, -2px); } 80% { transform: translate(3px, 2px); }
  }
  .stage.shake { animation: shake .35s ease; }

  @media (prefers-reduced-motion: reduce) {
    .stage.shake { animation: none; }
    body.started .scene { animation: none; }
    .stars i, .hint { animation: none; opacity: .5; }
    body.lit .outer, body.lit .inner { animation: none; }
    #glow { transition: opacity 1s ease, transform 0s; }
    .reveal { transform: none; transition: opacity .6s ease; }
  }
</style>
</head>
<body>

<div class="stars" id="stars" aria-hidden="true"></div>
<div id="glow" aria-hidden="true"></div>
<canvas id="fx" aria-hidden="true"></canvas>

<main class="stage">

  <!-- Step 1: friend apna naam + birthday daalta hai -->
  <div class="intro" id="introForm">
    <h1>Pehle apni details bharo 🪔</h1>
    <p class="sub">Ek chhota sa Diwali surprise tumhara wait kar raha hai.</p>
    <label for="inName">Tumhara naam</label>
    <input id="inName" type="text" maxlength="30" autocomplete="given-name" placeholder="Naam likho">
    <label for="inDob">Tumhara birthday</label>
    <input id="inDob" type="date">
    <p class="err" id="err" role="alert"></p>
    <button class="go" id="goBtn" type="button">Aage badho</button>
  </div>

  <!-- Step 2: diya + messages -->
  <div class="scene" id="scene">

  <section class="msg">
    <p class="agemsg" id="agemsg"></p>
    <h1 class="greeting reveal" id="greeting"></h1>
    <div id="lines"></div>
    <p class="joke reveal" id="joke"></p>
    <p class="sign reveal" id="sign"></p>
  </section>

  <button class="diya-btn" id="diyaBtn" aria-label="Diya jalao">
    <svg class="diya" viewBox="0 -34 200 176" xmlns="http://www.w3.org/2000/svg" role="img" aria-hidden="true">
      <defs>
        <linearGradient id="clay" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#d0693a"/>
          <stop offset=".55" stop-color="#b5532c"/>
          <stop offset="1" stop-color="#7a3017"/>
        </linearGradient>
        <linearGradient id="fo" x1="0" y1="1" x2="0" y2="0">
          <stop offset="0" stop-color="#d8281c"/>
          <stop offset=".35" stop-color="#ff7a18"/>
          <stop offset="1" stop-color="#ffd24a"/>
        </linearGradient>
        <linearGradient id="fi" x1="0" y1="1" x2="0" y2="0">
          <stop offset="0" stop-color="#ffb02e"/>
          <stop offset="1" stop-color="#fff7d1"/>
        </linearGradient>
      </defs>
      <!-- clay bowl -->
      <path d="M12 66 Q14 132 100 132 Q186 132 188 66 Z" fill="url(#clay)"/>
      <path d="M40 90 Q70 118 118 120" fill="none" stroke="#e3855a" stroke-opacity=".35" stroke-width="4" stroke-linecap="round"/>
      <!-- painted band -->
      <path d="M26 88 Q100 106 174 88" fill="none" stroke="#f5c04a" stroke-opacity=".7" stroke-width="2.5" stroke-dasharray="2 7" stroke-linecap="round"/>
      <!-- rim + oil -->
      <ellipse cx="100" cy="66" rx="88" ry="15" fill="#8a3b1c"/>
      <ellipse cx="100" cy="66" rx="76" ry="10" fill="#4d2108"/>
      <ellipse cx="100" cy="64" rx="40" ry="3.5" fill="#a5612b" fill-opacity=".45"/>
      <!-- wick -->
      <path d="M96 66 L97 52 L103 52 L104 66 Z" fill="#2a1608"/>
      <!-- flame -->
      <g id="flame">
        <path class="outer" d="M100 -26 C122 0 130 26 100 52 C70 26 78 0 100 -26 Z" fill="url(#fo)"/>
        <path class="inner" d="M100 8 C112 24 114 38 100 52 C86 38 88 24 100 8 Z" fill="url(#fi)"/>
      </g>
    </svg>
  </button>

  <p class="hint" id="hint">Diya par tap karo 🪔</p>
  <button class="replay reveal" id="replay">Replay 🪔</button>
  </div>
</main>

<script>
/* =========================================================
   1) EDIT HERE: yahan apna naam, friend ka naam aur message badlo
   ========================================================= */
const CONFIG = {
  diwaliDate: "2026-11-08",       // <-- Diwali ki date (age isi date ke hisaab se nikalti hai)
  yourName:   "YOGESH",           // <-- tumhara naam (page ke end me bold me dikhta hai)
  lines: [                        // <-- har item ek stanza hai, \n se line toot-ti hai
    "Diwali aayi hai, khushiyon ki bahaar laayi hai,\nAapke chehre par ek pyari si smile laayi hai! 😊",
    "Tension ko aaj chhutti de dijiye,\nMithai khaakar mood fresh kar lijiye! 🍫",
    "Aur haan, 23 tareekh tak jo CT ka pressure hai,\nUsko lekar bilkul tension mat lijiye! 😂📚",
    "Abhi Diwali enjoy kijiye,\nCT ki baari aayegi toh padhai bhi kar lenge,\nAur paper mein apna jalwa bhi dikha denge! 😎",
    "Bhagwan kare aapki life mein khushiyan hi khushiyan aayein,\nAur aapke saare CT bina tension ke achhe se ho jaayein! ❤️",
    "Aap hamesha khush rahiye, muskurate rahiye,\nAur apni cute si smile kabhi mat khoiye! 😊"
  ],
  closing: "🪔 Wishing you a very Happy Diwali! 🪔\n✨ Stay happy, stay blessed! ✨",   // <-- last gold line
  joke: "P.S. Patakhe jalate waqt apna dhyan rakhiyega, aapki safety sabse zaroori hai 🙏",  // <-- aakhri chhoti baat (khaali chhod sakte ho: "")
  sound: true,                    // chime band karna ho to false

  // Age ke hisaab se fun message. Upar se pehla match jeetega.
  // {name} aur {age} apne aap bhar jayenge. Apne style me badal sakte ho.
  ageMessages: [
    { upTo: 12,  text: "Congratulations {name}! 🎉 Ye tumhari {age}vi Diwali hai. Itni chhoti age me itne patakhe? Bade log bhi tumse seekhenge 😄" },
    { upTo: 17,  text: "Congratulations {name}! 🎉 Ye tumhari {age}vi Diwali hai. Thoda aur bade ho jao, phir ghar wale patakhe jalane bhi denge 😎" },
    { upTo: 18,  text: "Congratulations {name}! 🎉 Ye tumhari {age}vi Diwali hai, matlab ab officially adult! 'Ab bade ho gaye ho' wale lecture ke liye taiyaar rehna 😂" },
    { upTo: 25,  text: "Congratulations {name}! 🎉 Ye tumhari {age}vi Diwali hai. Itne saal se mithai kha rahe ho, aur abhi bhi pet me jagah hai? Legend ho! 🪔" },
    { upTo: 40,  text: "Congratulations {name}! 🎉 Ye tumhari {age}vi Diwali hai. Itne saalon ka tajurba, ab to rangoli ke judge ban sakte ho 😄" },
    { upTo: 200, text: "Congratulations {name}! 🎉 Ye tumhari {age}vi Diwali hai. Itna tajurba? Aap to Diwali ke senior professor ho 🎓" }
  ]
};
/* ========================================================= */

const $ = (s) => document.querySelector(s);
const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const K = reduced ? 0.45 : 1;        // time multiplier: reduced motion = faster, calmer sequence

// ---- fill text from CONFIG ----
const signEl = $("#sign");
signEl.append("- ");
const signName = document.createElement("strong");
signName.textContent = CONFIG.yourName;
signEl.append(signName, " 💛");
$("#joke").textContent = CONFIG.joke;
if (!CONFIG.joke) $("#joke").style.display = "none";
const linesBox = $("#lines");
CONFIG.lines.forEach((t) => {
  const p = document.createElement("p");
  p.className = "line reveal";
  p.textContent = t;
  linesBox.appendChild(p);
});
if (CONFIG.closing) {
  const c = document.createElement("p");
  c.className = "line closing reveal";
  c.textContent = CONFIG.closing;
  linesBox.appendChild(c);
}

// ---- twinkling stars ----
const starsBox = $("#stars");
for (let i = 0; i < 45; i++) {
  const s = document.createElement("i");
  s.style.left = Math.random() * 100 + "%";
  s.style.top = Math.random() * 100 + "%";
  s.style.setProperty("--d", (2 + Math.random() * 3).toFixed(1) + "s");
  s.style.setProperty("--delay", (Math.random() * 3).toFixed(1) + "s");
  starsBox.appendChild(s);
}

// ---- timers ----
let timers = [];
const later = (fn, ms) => timers.push(setTimeout(fn, ms));

// ---- chime (Web Audio, no files; runs only after the tap) ----
let actx = null;
function chime() {
  if (!CONFIG.sound) return;
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    actx = actx || new AC();
    if (actx.state === "suspended") actx.resume();
    const now = actx.currentTime;
    [[659.25, 0], [783.99, .14], [987.77, .28], [1318.5, .42]].forEach(([f, d]) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = "sine"; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, now + d);
      g.gain.exponentialRampToValueAtTime(0.06, now + d + 0.03);
      g.gain.exponentialRampToValueAtTime(0.0001, now + d + 1.6);
      o.connect(g).connect(actx.destination);
      o.start(now + d); o.stop(now + d + 1.7);
    });
  } catch (e) { /* sound is optional */ }
}

/* =========================================================
   Canvas effects: sparks from the flame, petals, fireworks
   ========================================================= */
const cv = $("#fx"), ctx = cv.getContext("2d");
let W = 0, H = 0, dpr = 1, particles = [], raf = 0, last = 0;
let lit = false, petalsOn = false, fireworksOn = false, nextFw = 0;
const MAX = reduced ? 60 : 220;
const PALETTE = ["#ffd24a", "#ff9a2e", "#ffe9a8", "#ff6a3d", "#f5c04a"];

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener("resize", resize);
resize();

const rand = (a, b) => a + Math.random() * (b - a);
const pick = (arr) => arr[(Math.random() * arr.length) | 0];

function flamePoint() {
  const r = $("#flame").getBoundingClientRect();
  return { x: r.left + r.width / 2, y: r.top + r.height * 0.3 };
}
function spawnSpark() {
  const p = flamePoint();
  particles.push({ t: "spark", x: p.x + rand(-6, 6), y: p.y, vx: rand(-14, 14), vy: rand(-70, -35),
    life: 0, max: rand(1.2, 2.4), size: rand(1, 2.4), c: pick(PALETTE) });
}
function spawnPetal() {
  particles.push({ t: "petal", x: rand(0, W), y: -14, vx: rand(-12, 12), vy: rand(38, 75),
    life: 0, max: 99, size: rand(4, 7), rot: rand(0, 6.28), vr: rand(-2, 2), ph: rand(0, 6.28),
    c: pick(["#ff9a2e", "#f5b02e", "#e8622a", "#ffc94d"]) });
}
function burst() {
  const x = rand(W * .15, W * .85), y = rand(H * .1, H * .42), n = reduced ? 0 : 22;
  const c = pick(PALETTE);
  for (let i = 0; i < n; i++) {
    const a = (i / n) * 6.283 + rand(-.1, .1), s = rand(60, 140);
    particles.push({ t: "fw", x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
      life: 0, max: rand(.9, 1.5), size: rand(1.2, 2.2), c });
  }
}

let sparkAcc = 0, petalAcc = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000 || 0.016); last = now;
  ctx.clearRect(0, 0, W, H);

  if (lit && particles.length < MAX) {
    sparkAcc += dt * (reduced ? 6 : 16);
    while (sparkAcc >= 1) { spawnSpark(); sparkAcc--; }
    if (petalsOn) { petalAcc += dt * 3; while (petalAcc >= 1) { spawnPetal(); petalAcc--; } }
  }
  if (fireworksOn && now > nextFw && particles.length < MAX) { burst(); nextFw = now + rand(1800, 3200); }

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life += dt;
    if (p.t === "petal") {
      p.x += (p.vx + Math.sin(p.life * 1.6 + p.ph) * 24) * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
      if (p.y > H + 20) { particles.splice(i, 1); continue; }
      ctx.globalCompositeOperation = "source-over"; ctx.globalAlpha = .85; ctx.fillStyle = p.c;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.beginPath(); ctx.ellipse(0, 0, p.size, p.size * .55, 0, 0, 6.283); ctx.fill(); ctx.restore();
    } else {
      if (p.life >= p.max) { particles.splice(i, 1); continue; }
      if (p.t === "fw") { p.vy += 90 * dt; p.vx *= .985; }
      p.x += p.vx * dt; p.y += p.vy * dt;
      ctx.globalCompositeOperation = "lighter";
      ctx.globalAlpha = 1 - p.life / p.max; ctx.fillStyle = p.c;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, 6.283); ctx.fill();
    }
  }
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = "source-over";

  if (lit || particles.length) raf = requestAnimationFrame(frame); else raf = 0;
}
function startLoop() { if (!raf) { last = performance.now(); raf = requestAnimationFrame(frame); } }

/* =========================================================
   Story sequence
   ========================================================= */
const btn = $("#diyaBtn"), replayBtn = $("#replay");

// element ko dikhata hai aur phone par neeche scroll karke screen ke beech le aata hai
function showEl(el) {
  el.classList.add("show");
  el.scrollIntoView({ behavior: reduced ? "auto" : "smooth", block: "center" });
}

function lightDiya() {
  if (lit) return;
  lit = true; btn.disabled = true;
  document.body.classList.add("lit");
  chime();
  startLoop();

  // diya jalte hi patakhe: awaaz + screen par burst (chime ke thoda baad, dhamakon ke saath sync)
  firecrackers();
  if (!reduced) [1100, 2600, 3700, 6000, 6250].forEach((ms) => later(bang, ms));

  later(() => document.body.classList.add("talk"), 2000 * K);

  // 1) fun age message print hota hai  2) phir "Happy Diwali, Naam!"  3) phir wish lines
  const chars = document.querySelectorAll(".ch");
  const step = reduced ? 0 : 38;
  const typeStart = 2400 * K;
  chars.forEach((el, i) => later(() => el.classList.add("on"), typeStart + i * step));
  const gTime = typeStart + chars.length * step + 800 * K;
  later(() => { $("#greeting").classList.add("show"); petalsOn = !reduced; }, gTime);

  let t = gTime + 1700 * K;
  document.querySelectorAll(".line").forEach((el) => { later(() => showEl(el), t); t += 2000 * K; });
  if (CONFIG.joke) { later(() => showEl($("#joke")), t); t += 1600 * K; }
  later(() => {
    showEl($("#sign"));
    fireworksOn = !reduced; nextFw = performance.now() + 400;
  }, t);
  later(() => replayBtn.classList.add("show"), t + 1500 * K);
}

function reset() {
  timers.forEach(clearTimeout); timers = [];
  lit = false; petalsOn = false; fireworksOn = false; particles = []; sparkAcc = petalAcc = 0;
  document.body.classList.remove("lit", "talk");
  document.querySelectorAll(".reveal").forEach((el) => el.classList.remove("show"));
  document.querySelectorAll(".ch").forEach((el) => el.classList.remove("on"));
  btn.disabled = false;
  ctx.clearRect(0, 0, W, H);
  window.scrollTo(0, 0);
}

// ---- Firecracker sounds (Web Audio, koi audio file nahi) ----
let noiseBuf = null, master = null, punch = null;
function noiseBuffer() {
  if (!noiseBuf) {
    noiseBuf = actx.createBuffer(1, actx.sampleRate * 2, actx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  return noiseBuf;
}
function out() {
  if (!master) {
    const comp = actx.createDynamicsCompressor();       // phone speaker me phategi nahi, par dam rahega
    comp.threshold.value = -22; comp.knee.value = 8; comp.ratio.value = 10;
    comp.attack.value = 0.001; comp.release.value = 0.2;
    master = actx.createGain(); master.gain.value = 1.4;
    // gunj (echo): khule maidan me patakhe jaisi awaaz
    const len = Math.floor(actx.sampleRate * 1.8), ir = actx.createBuffer(2, len, actx.sampleRate);
    for (let c = 0; c < 2; c++) {
      const d = ir.getChannelData(c);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
    }
    const verb = actx.createConvolver(); verb.buffer = ir;
    const wet = actx.createGain(); wet.gain.value = 0.45;
    master.connect(comp); master.connect(verb); verb.connect(wet); wet.connect(comp);
    comp.connect(actx.destination);
    // thoda distortion = tez, kadak "punch"
    punch = actx.createWaveShaper();
    const curve = new Float32Array(256);
    for (let i = 0; i < 256; i++) curve[i] = Math.tanh((i / 255 * 2 - 1) * 3);
    punch.curve = curve; punch.connect(master);
  }
  return master;
}
const bus = () => { out(); return punch; };

function crack(at, vol, big) {          // kadak "tak!" (chatak)
  const dur = big ? 0.16 : 0.07;
  const src = actx.createBufferSource(); src.buffer = noiseBuffer();
  const hp = actx.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = big ? 500 : 1200;
  const g = actx.createGain();
  g.gain.setValueAtTime(0.0001, at);
  g.gain.exponentialRampToValueAtTime(vol, at + 0.0008);
  g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
  src.connect(hp).connect(g).connect(bus());
  src.start(at, Math.random() * 1.7, dur + 0.05);
  const o = actx.createOscillator(), og = actx.createGain();   // chhota "tok" body
  o.frequency.setValueAtTime(big ? 260 : 420, at); o.frequency.exponentialRampToValueAtTime(70, at + 0.04);
  og.gain.setValueAtTime(vol * 0.5, at); og.gain.exponentialRampToValueAtTime(0.0001, at + 0.05);
  o.connect(og).connect(out()); o.start(at); o.stop(at + 0.06);
}
function boom(at, vol) {                // bada bomb: chatak + bhaari thump + gubaar
  crack(at, vol, true);
  const o = actx.createOscillator(), og = actx.createGain();
  o.type = "triangle"; o.frequency.setValueAtTime(190, at); o.frequency.exponentialRampToValueAtTime(45, at + 0.5);
  og.gain.setValueAtTime(0.0001, at);
  og.gain.exponentialRampToValueAtTime(vol, at + 0.004);
  og.gain.exponentialRampToValueAtTime(0.0001, at + 0.9);
  o.connect(og).connect(bus()); o.start(at); o.stop(at + 1);
  const n = actx.createBufferSource(); n.buffer = noiseBuffer();
  const lp = actx.createBiquadFilter(); lp.type = "lowpass";
  lp.frequency.setValueAtTime(3500, at); lp.frequency.exponentialRampToValueAtTime(180, at + 0.7);
  const ng = actx.createGain();
  ng.gain.setValueAtTime(0.0001, at);
  ng.gain.exponentialRampToValueAtTime(vol, at + 0.003);
  ng.gain.exponentialRampToValueAtTime(0.0001, at + 0.9);
  n.connect(lp).connect(ng).connect(bus()); n.start(at, Math.random(), 1);
}
function fuse(at, dur) {                // patakhe ki batti jalne ki "ssss"
  const n = actx.createBufferSource(); n.buffer = noiseBuffer();
  const hp = actx.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 3500;
  const g = actx.createGain();
  g.gain.setValueAtTime(0.0001, at);
  g.gain.exponentialRampToValueAtTime(0.07, at + 0.05);
  g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
  n.connect(hp).connect(g).connect(out()); n.start(at, Math.random(), dur + 0.1);
}
function whistle(at, dur) {             // rocket ki seeti
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = "sine"; o.frequency.setValueAtTime(700, at); o.frequency.exponentialRampToValueAtTime(2600, at + dur);
  g.gain.setValueAtTime(0.0001, at);
  g.gain.exponentialRampToValueAtTime(0.06, at + 0.05);
  g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
  o.connect(g).connect(out()); o.start(at); o.stop(at + dur + 0.05);
}
function crackle(at, count, span) {     // laadi: tadatadatada...
  for (let i = 0; i < count; i++) {
    const when = at + Math.pow(i / count, 0.85) * span + Math.random() * 0.04;
    const loud = Math.random() < 0.2;
    crack(when, loud ? 0.95 : 0.35 + Math.random() * 0.4, loud);
    if (Math.random() < 0.25) crack(when + 0.035, 0.3, false);
  }
}
function firecrackers() {
  if (!CONFIG.sound) return;
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    actx = actx || new AC();
    if (actx.state === "suspended") actx.resume();
    const t = actx.currentTime + 0.55;
    fuse(t, 0.5);          boom(t + 0.5, 0.9);          // pehla bomb
    whistle(t + 1.2, 0.8); boom(t + 2.0, 1.0);          // rocket
    fuse(t + 2.5, 0.35);   crackle(t + 2.85, 48, 2.4);  // laadi
    boom(t + 5.4, 1.0);    boom(t + 5.65, 0.9);         // grand finale
  } catch (e) { /* sound optional */ }
}
// har dhamake par: fireworks + screen halki si hilti hai + phone vibrate
function bang() {
  burst(); startLoop();
  const st = document.querySelector(".stage");
  st.classList.remove("shake"); void st.offsetWidth; st.classList.add("shake");
  if (navigator.vibrate) navigator.vibrate(60);
}

// ---- Step 1: naam + birthday -> age -> fun message ----
function ageOn(dob, ref) {
  const a = (dob || "").split("-").map(Number), b = ref.split("-").map(Number);
  if (a.length !== 3 || a.some(isNaN)) return null;
  let age = b[0] - a[0];
  if (b[1] < a[1] || (b[1] === a[1] && b[2] < a[2])) age--;
  return age;
}
function funText(name, age) {
  const m = CONFIG.ageMessages.find((x) => age <= x.upTo) || CONFIG.ageMessages[CONFIG.ageMessages.length - 1];
  return m.text.replace(/\{name\}/g, name).replace(/\{age\}/g, age);
}
$("#inDob").max = CONFIG.diwaliDate;

function startFlow() {
  if (document.body.classList.contains("started")) return;   // double tap se dobara na chale
  const name = $("#inName").value.trim().replace(/\s+/g, " ");
  const age = ageOn($("#inDob").value, CONFIG.diwaliDate);
  const err = $("#err");
  if (!name) { err.textContent = "Pehle apna naam to likho 🙂"; return; }
  if (age === null || age < 5 || age > 100) { err.textContent = "Sahi birthday chuno, phir try karo."; return; }
  err.textContent = "";

  document.title = "Happy Diwali " + name;
  $("#greeting").textContent = "Happy Diwali, " + name + "! ✨";
  const box = $("#agemsg");
  box.textContent = "";
  Array.from(funText(name, age)).forEach((c) => {     // har character alag span: typing effect ke liye
    const s = document.createElement("span");
    s.className = "ch"; s.textContent = c; box.appendChild(s);
  });
  document.body.classList.add("started");
  window.scrollTo(0, 0);
}
$("#goBtn").addEventListener("click", startFlow);
["#inName", "#inDob"].forEach((id) => $(id).addEventListener("keydown", (e) => { if (e.key === "Enter") startFlow(); }));

btn.addEventListener("click", lightDiya);
replayBtn.addEventListener("click", reset);
</script>
